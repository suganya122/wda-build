name: Build WebDriverAgent (unsigned)

on:
  workflow_dispatch:
    inputs:
      wda_ref:
        description: "Appium WebDriverAgent tag"
        default: "v16.15.3"
      xcode:
        description: "Xcode version on the runner"
        default: "26.3"

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode }}.app"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Check out WebDriverAgent
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: ${{ inputs.wda_ref }}

      - name: Build for device, unsigned
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app Payload/
          zip -qr WebDriverAgentRunner.ipa Payload
          ls -lh WebDriverAgentRunner.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-ipa
          path: WebDriverAgentRunner.ipa
